id: 02_workflow_orchestration_foreach
namespace: zoomcamp

description: |
  Load NYC Taxi data using foreach (taxi → year → month)

inputs:
  - id: taxi
    type: ARRAY
    itemType: STRING
    defaults: [yellow, green]

  - id: year
    type: ARRAY
    itemType: INT
    defaults: [2021]

  - id: month
    type: ARRAY
    itemType: STRING
    defaults: ['01','02','03','04','05','06','07']

tasks:
  - id: foreach_taxi
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{inputs.taxi}}"
    tasks:

      - id: foreach_year
        type: io.kestra.plugin.core.flow.ForEach
        values: "{{inputs.year}}"
        tasks:

          - id: foreach_month
            type: io.kestra.plugin.core.flow.ForEach
            values: "{{inputs.month}}"
            tasks:

              # -------------------------
              # EXTRACT
              # -------------------------
              - id: extract
                type: io.kestra.plugin.scripts.shell.Commands
                outputFiles: ["*.csv"]
                taskRunner:
                  type: io.kestra.plugin.core.runner.Process
                commands:
                  - |
                    wget -qO- https://github.com/DataTalksClub/nyc-tlc-data/releases/download/{{parents[1].taskrun.value}}/{{parents[1].taskrun.value}}_tripdata_{{parents[0].taskrun.value}}-{{taskrun.value}}.csv.gz \
                    | gunzip > {{parents[1].taskrun.value}}_tripdata_{{parents[0].taskrun.value}}-{{taskrun.value}}.csv

              # ======================================================
              # YELLOW TAXI
              # ======================================================
              - id: if_yellow
                type: io.kestra.plugin.core.flow.If
                condition: "{{parents[2].taskrun.value == 'yellow'}}"
                then:

                  - id: yellow_create_tables
                    type: io.kestra.plugin.jdbc.postgresql.Queries
                    sql: |
                      CREATE TABLE IF NOT EXISTS {{parents[1].taskrun.value}}_tripdata (
                        unique_row_id text,
                        filename text,
                        VendorID text,
                        tpep_pickup_datetime timestamp,
                        tpep_dropoff_datetime timestamp,
                        passenger_count integer,
                        trip_distance double precision,
                        RatecodeID text,
                        store_and_fwd_flag text,
                        PULocationID text,
                        DOLocationID text,
                        payment_type integer,
                        fare_amount double precision,
                        extra double precision,
                        mta_tax double precision,
                        tip_amount double precision,
                        tolls_amount double precision,
                        improvement_surcharge double precision,
                        total_amount double precision,
                        congestion_surcharge double precision
                      );

                      CREATE TABLE IF NOT EXISTS {{parents[1].taskrun.value}}_tripdata_staging (
                        LIKE {{parents[1].taskrun.value}}_tripdata INCLUDING ALL
                      );

                  - id: yellow_truncate_staging
                    type: io.kestra.plugin.jdbc.postgresql.Queries
                    sql: TRUNCATE TABLE {{parents[1].taskrun.value}}_tripdata_staging;

                  - id: yellow_copy
                    type: io.kestra.plugin.jdbc.postgresql.CopyIn
                    format: CSV
                    from: "{{outputs.extract.outputFiles[parents[1].taskrun.value ~ '_tripdata_' ~ parents[0].taskrun.value ~ '-' ~ taskrun.value ~ '.csv']}}"
                    table: "{{parents[1].taskrun.value}}_tripdata_staging"
                    header: true
                    columns:
                      [VendorID,tpep_pickup_datetime,tpep_dropoff_datetime,passenger_count,trip_distance,RatecodeID,store_and_fwd_flag,PULocationID,DOLocationID,payment_type,fare_amount,extra,mta_tax,tip_amount,tolls_amount,improvement_surcharge,total_amount,congestion_surcharge]

                  - id: yellow_enrich
                    type: io.kestra.plugin.jdbc.postgresql.Queries
                    sql: |
                      UPDATE {{parents[1].taskrun.value}}_tripdata_staging
                      SET unique_row_id = md5(
                        COALESCE(VendorID,'') ||
                        COALESCE(tpep_pickup_datetime::text,'') ||
                        COALESCE(tpep_dropoff_datetime::text,'') ||
                        COALESCE(PULocationID,'') ||
                        COALESCE(DOLocationID,'') ||
                        COALESCE(fare_amount::text,'') ||
                        COALESCE(trip_distance::text,'')
                      ),
                      filename='{{parents[1].taskrun.value}}_tripdata_{{parents[0].taskrun.value}}-{{taskrun.value}}.csv';

                  - id: yellow_merge
                    type: io.kestra.plugin.jdbc.postgresql.Queries
                    sql: |
                      MERGE INTO {{parents[1].taskrun.value}}_tripdata t
                      USING {{parents[1].taskrun.value}}_tripdata_staging s
                      ON t.unique_row_id = s.unique_row_id
                      WHEN NOT MATCHED THEN INSERT SELECT * FROM s;

              # ======================================================
              # GREEN TAXI
              # ======================================================
              - id: if_green
                type: io.kestra.plugin.core.flow.If
                condition: "{{parents[1].taskrun.value == 'green'}}"
                then:

                  - id: green_create_tables
                    type: io.kestra.plugin.jdbc.postgresql.Queries
                    sql: |
                      CREATE TABLE IF NOT EXISTS {{parents[1].taskrun.value}}_tripdata (
                        unique_row_id text,
                        filename text,
                        VendorID text,
                        lpep_pickup_datetime timestamp,
                        lpep_dropoff_datetime timestamp,
                        store_and_fwd_flag text,
                        RatecodeID text,
                        PULocationID text,
                        DOLocationID text,
                        passenger_count integer,
                        trip_distance double precision,
                        fare_amount double precision,
                        extra double precision,
                        mta_tax double precision,
                        tip_amount double precision,
                        tolls_amount double precision,
                        ehail_fee double precision,
                        improvement_surcharge double precision,
                        total_amount double precision,
                        payment_type integer,
                        trip_type integer,
                        congestion_surcharge double precision
                      );

                      CREATE TABLE IF NOT EXISTS {{parents[1].taskrun.value}}_tripdata_staging (
                        LIKE {{parents[1].taskrun.value}}_tripdata INCLUDING ALL
                      );

                  - id: green_truncate_staging
                    type: io.kestra.plugin.jdbc.postgresql.Queries
                    sql: TRUNCATE TABLE {{parents[1].taskrun.value}}_tripdata_staging;

                  - id: green_copy
                    type: io.kestra.plugin.jdbc.postgresql.CopyIn
                    format: CSV
                    from: "{{outputs.extract.outputFiles[parents[1].taskrun.value ~ '_tripdata_' ~ parents[0].taskrun.value ~ '-' ~ taskrun.value ~ '.csv']}}"
                    table: "{{parents[1].taskrun.value}}_tripdata_staging"
                    header: true
                    columns:
                      [VendorID,lpep_pickup_datetime,lpep_dropoff_datetime,store_and_fwd_flag,RatecodeID,PULocationID,DOLocationID,passenger_count,trip_distance,fare_amount,extra,mta_tax,tip_amount,tolls_amount,ehail_fee,improvement_surcharge,total_amount,payment_type,trip_type,congestion_surcharge]

                  - id: green_enrich
                    type: io.kestra.plugin.jdbc.postgresql.Queries
                    sql: |
                      UPDATE {{parents[1].taskrun.value}}_tripdata_staging
                      SET unique_row_id = md5(
                        COALESCE(VendorID,'') ||
                        COALESCE(lpep_pickup_datetime::text,'') ||
                        COALESCE(lpep_dropoff_datetime::text,'') ||
                        COALESCE(PULocationID,'') ||
                        COALESCE(DOLocationID,'') ||
                        COALESCE(fare_amount::text,'') ||
                        COALESCE(trip_distance::text,'')
                      ),
                      filename='{{parents[1].taskrun.value}}_tripdata_{{parents[0].taskrun.value}}-{{taskrun.value}}.csv';

                  - id: green_merge
                    type: io.kestra.plugin.jdbc.postgresql.Queries
                    sql: |
                      MERGE INTO {{parents[1].taskrun.value}}_tripdata t
                      USING {{parents[1].taskrun.value}}_tripdata_staging  s
                      ON t.unique_row_id = s.unique_row_id
                      WHEN NOT MATCHED THEN INSERT SELECT * FROM s;

pluginDefaults:
  - type: io.kestra.plugin.jdbc.postgresql
    values:
      url: jdbc:postgresql://pgdatabase:5432/ny_taxi
      username: root
      password: root; 
